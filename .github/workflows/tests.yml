name: Automated checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - run: python -m pytest -m "api or unit" -n 2 --dist loadfile --clean-alluredir --alluredir=allure-results --junitxml=test-results/api.xml
      - name: Generate Allure HTML
        if: always()
        run: npm exec --yes --package=allure-commandline@2.46.1 -- allure generate allure-results --single-file -o allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-api
          path: |
            allure-results/
            allure-report/
            test-results/
  browsers:
    runs-on: windows-latest
    timeout-minutes: 20
    needs: api
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - if: matrix.browser == 'firefox'
        run: python -m playwright install firefox
      - name: Run test suite
        run: python -m pytest -m ui --browser-name=${{ matrix.browser }} -n 2 --dist loadfile --clean-alluredir --alluredir=allure-results --junitxml=test-results/ui.xml
      - name: Generate Allure HTML
        if: always()
        run: npm exec --yes --package=allure-commandline@2.46.1 -- allure generate allure-results --single-file -o allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.browser }}
          path: |
            allure-results/
            allure-report/
            test-results/
          if-no-files-found: ignore
